# Publish aurora-mcp to PyPI via trusted publishing (no API token in repo).
# One-time setup on pypi.org: project "aurora-mcp" -> Settings -> Publishing ->
# add GitHub publisher (owner FantasyLab-ai, repo aurora, workflow
# publish-pypi.yml, environment pypi).
# Release: bump version in pyproject.toml + server.json, then
#   git tag pypi-v0.9.5 && git push origin pypi-v0.9.5
name: Publish aurora-mcp to PyPI

on:
  push:
    tags: ["pypi-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
