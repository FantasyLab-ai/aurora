services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: surplusnet
      POSTGRES_PASSWORD: surplusnet
      POSTGRES_DB: surplusnet
    ports:
      - "5433:5432"
    volumes:
      - surplusnet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surplusnet"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  surplusnet-pgdata:
